<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="/assets/css/styles.css" />
        <title>Mermaid Diagrammarten: Übersicht mit Code</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                color: #1a1a1a;
                background: #ffffff;
                line-height: 1.5;
            }
            main {
                max-width: 1200px;
                margin: 0 auto;
                padding: 2rem 1.25rem;
            }
            h1 {
                font-size: 1.5rem;
                margin: 0 0 0.25rem;
            }
            p.lead {
                margin: 0 0 1rem;
                color: #4a4a4a;
            }
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.75rem;
                margin: 0 0 1.5rem;
            }
            .toolbar label {
                font-weight: bold;
                font-size: 0.95rem;
            }
            input[type="search"] {
                font: inherit;
                font-size: 0.95rem;
                padding: 0.4rem 0.6rem;
                border: 1px solid #8a939c;
                border-radius: 4px;
                min-width: 260px;
            }
            .count {
                font-size: 0.9rem;
                color: #5a5a5a;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(min(100%, 520px), 1fr)
                );
                gap: 1.25rem;
            }
            .card {
                border: 1px solid #d9d9d9;
                border-radius: 6px;
                padding: 1rem 1.1rem;
                display: flex;
                flex-direction: column;
                gap: 0.6rem;
                min-width: 0;
            }
            .card[hidden] {
                display: none;
            }
            .card h2 {
                font-size: 1.05rem;
                margin: 0;
                color: #1f4e79;
            }
            .card .kw {
                font-family: "Courier New", monospace;
                font-size: 0.8rem;
                color: #5a5a5a;
                margin: 0;
            }
            .card p.desc {
                margin: 0;
                font-size: 0.92rem;
                color: #333;
            }
            .render {
                border: 1px solid #ececec;
                border-radius: 4px;
                padding: 0.5rem;
                overflow-x: auto;
                background: #fbfbfc;
                min-height: 80px;
            }
            .render svg {
                display: block;
                max-width: 100%;
                height: auto;
                margin: 0 auto;
            }
            .render .loading {
                font-size: 0.9rem;
                color: #5a5a5a;
                margin: 0;
            }
            .render .error {
                font-size: 0.9rem;
                color: #b00020;
                font-weight: bold;
                margin: 0;
            }
            details summary {
                cursor: pointer;
                font-weight: bold;
                font-size: 0.92rem;
                padding: 0.2rem 0;
            }
            details summary:focus-visible,
            button:focus-visible,
            input:focus-visible {
                outline: 3px solid #b7791f;
                outline-offset: 2px;
            }
            .code-head {
                display: flex;
                justify-content: flex-end;
                margin: 0.4rem 0 0.3rem;
            }
            .copy {
                font: inherit;
                font-size: 0.85rem;
                padding: 0.25rem 0.7rem;
                border: 1px solid #1f4e79;
                border-radius: 4px;
                background: #ffffff;
                color: #1f4e79;
                cursor: pointer;
            }
            pre {
                margin: 0;
                background: #f4f6f8;
                border-radius: 4px;
                padding: 0.7rem;
                overflow-x: auto;
                font-size: 0.82rem;
                line-height: 1.45;
            }
            code {
                font-family: "Courier New", monospace;
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                    animation: none !important;
                }
            }
        </style>
    </head>
    <body>
        <main id="main-content">
            <h1>Mermaid Diagrammarten</h1>
            <p class="lead">
                Jede Karte zeigt ein gerendertes Beispiel und den zugehörigen
                Mermaid-Code. Der Code kann einzeln kopiert werden.
            </p>

            <div class="toolbar">
                <label for="filter">Suchen:</label>
                <input
                    type="search"
                    id="filter"
                    placeholder="z. B. Ablauf, Zeit, Klassen"
                    aria-describedby="count" />
                <span
                    class="count"
                    id="count"
                    aria-live="polite"></span>
            </div>

            <div
                class="grid"
                id="grid"></div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
        <script>
            // >>>>>>>
            var diagrams = [
                {
                    name: "Flowchart",
                    keywords: "Ablauf Ablaufdiagramm Entscheidung Prozess",
                    desc: "Abläufe und Entscheidungen mit Knoten und Pfeilen. Rechteck für Schritte, Raute für Verzweigungen.",
                    code: `flowchart LR
  A[Anfrage] --> B{Verfügbar?}
  B -- Ja --> C[Buchen]
  B -- Nein --> D[Alternative vorschlagen]`,
                },
                {
                    name: "Sequence Diagram",
                    keywords: "Sequenz Interaktion Nachrichten Zeitablauf",
                    desc: "Nachrichtenaustausch zwischen Teilnehmern über die Zeit.",
                    code: `sequenceDiagram
  participant K as Kunde
  participant S as Server
  K->>S: Login anfordern
  S-->>K: Token zurück`,
                },
                {
                    name: "Class Diagram",
                    keywords: "Klassen Objekte Vererbung UML",
                    desc: "Klassen mit Attributen, Methoden und Beziehungen.",
                    code: `classDiagram
  class Seminar {
    +String titel
    +buchen()
  }
  class Teilnehmer {
    +String name
  }
  Seminar "1" --> "*" Teilnehmer`,
                },
                {
                    name: "State Diagram",
                    keywords: "Zustand Status Zustandsautomat",
                    desc: "Zustände eines Objekts und die Übergänge dazwischen.",
                    code: `stateDiagram-v2
  [*] --> Offen
  Offen --> Bestaetigt: Zusage
  Bestaetigt --> Durchgefuehrt
  Durchgefuehrt --> [*]`,
                },
                {
                    name: "Entity Relationship Diagram",
                    keywords: "ER Datenbank Tabellen Beziehungen",
                    desc: "Datenmodell mit Entitäten und deren Kardinalitäten.",
                    code: `erDiagram
  KUNDE ||--o{ BUCHUNG : taetigt
  BUCHUNG }o--|| SEMINAR : betrifft`,
                },
                {
                    name: "User Journey",
                    keywords: "Nutzererlebnis Journey Bewertung Erlebnis",
                    desc: "Erlebnis einer Person in Schritten, mit Bewertung von 1 bis 5.",
                    code: `journey
  title Seminartag
  section Anreise
    Shuttle nehmen: 5: Teilnehmer
  section Seminar
    Lernen: 4: Teilnehmer, Dozent`,
                },
                {
                    name: "Gantt Chart",
                    keywords: "Zeitplan Projekt Meilensteine Termine",
                    desc: "Projektplan mit Aufgaben, Dauer und Abhängigkeiten.",
                    code: `gantt
  title Projektplan
  dateFormat YYYY-MM-DD
  section Planung
  Konzept :a1, 2026-01-05, 5d
  Umsetzung :after a1, 10d`,
                },
                {
                    name: "Pie Chart",
                    keywords: "Kreis Anteile Verteilung Prozent",
                    desc: "Anteile eines Ganzen als Kreisdiagramm.",
                    code: `pie title Beispielverteilung
  "Gruppe A" : 40
  "Gruppe B" : 35
  "Sonstige" : 25`,
                },
                {
                    name: "Quadrant Chart",
                    keywords: "Matrix Priorisierung Quadranten Vier-Felder",
                    desc: "Punkte in einer Vier-Felder-Matrix, zum Beispiel für Priorisierung.",
                    code: `quadrantChart
  title Priorisierung
  x-axis Aufwand niedrig --> Aufwand hoch
  y-axis Nutzen niedrig --> Nutzen hoch
  quadrant-1 Jetzt umsetzen
  quadrant-2 Planen
  quadrant-3 Verwerfen
  quadrant-4 Schnell erledigen
  Feature A: [0.3, 0.8]
  Feature B: [0.7, 0.4]`,
                },
                {
                    name: "Requirement Diagram",
                    keywords: "Anforderungen Requirements Test Nachweis",
                    desc: "Anforderungen und die Elemente, die sie erfüllen oder prüfen.",
                    code: `requirementDiagram
  requirement REQ1 {
    id: 1
    text: Die Seite ist per Tastatur bedienbar.
    risk: high
    verifymethod: test
  }
  element Pruefverfahren {
    type: manual
  }
  Pruefverfahren - satisfies -> REQ1`,
                },
                {
                    name: "Git Graph",
                    keywords: "Git Branch Merge Versionen Commit",
                    desc: "Commits, Branches und Merges einer Versionsverwaltung.",
                    code: `gitGraph
  commit id: "init"
  branch feature
  checkout feature
  commit id: "karte"
  checkout main
  merge feature`,
                },
                {
                    name: "C4 Context Diagram",
                    keywords: "Architektur System Kontext C4 Personen",
                    desc: "Systemkontext mit Personen, Systemen und deren Beziehungen.",
                    code: `C4Context
  title Systemkontext
  Person(user, "Teilnehmer", "Bucht Seminare")
  System(gfu, "Buchungssystem", "Verwaltet Seminare")
  Rel(user, gfu, "Nutzt")`,
                },
                {
                    name: "Mindmap",
                    keywords: "Gedanken Ideen Struktur Themen",
                    desc: "Hierarchische Gedankenstruktur ausgehend von einem Zentrum.",
                    code: `mindmap
  root((Seminar))
    Inhalt
      Theorie
      Praxis
    Organisation
      Termin
      Ort`,
                },
                {
                    name: "Timeline",
                    keywords: "Zeitleiste Chronologie Historie Meilensteine",
                    desc: "Ereignisse in chronologischer Reihenfolge.",
                    code: `timeline
  title Meilensteine
  2024 : Start
  2025 : Erster Kurs
       : 100 Teilnehmer
  2026 : Ausbau`,
                },
                {
                    name: "Sankey Diagram",
                    keywords: "Fluss Energie Mengen Verteilung",
                    desc: "Mengenflüsse zwischen Knoten, Breite entspricht dem Wert.",
                    code: `sankey-beta
Kraftstoff,Motor,65
Kraftstoff,Mechanik,35
Mechanik,Rad,30
Mechanik,Verlust,5`,
                },
                {
                    name: "XY Chart",
                    keywords: "Balken Linien Diagramm Achsen Umsatz",
                    desc: "Balken- und Liniendiagramm mit Achsen.",
                    code: `xychart-beta
  title "Umsatz"
  x-axis [Q1, Q2, Q3, Q4]
  y-axis "Mio" 0 --> 20
  bar [8, 12, 9, 15]
  line [8, 12, 9, 15]`,
                },
                {
                    name: "Block Diagram",
                    keywords: "Blöcke Architektur Komponenten Schichten",
                    desc: "Komponenten als Blöcke in einem frei anordenbaren Raster.",
                    code: `block-beta
  columns 3
  a["Frontend"] b["API"] c["Datenbank"]
  a --> b
  b --> c`,
                },
                {
                    name: "Packet Diagram",
                    keywords: "Paket Netzwerk Bits Protokoll Header",
                    desc: "Aufbau eines Datenpakets nach Bit-Bereichen.",
                    code: `packet-beta
  0-15: "Quelle"
  16-31: "Ziel"`,
                },
            ];
            // <<<<<<<

            (function () {
                var grid = document.getElementById("grid");
                var filter = document.getElementById("filter");
                var count = document.getElementById("count");
                var cards = [];

                function buildCard(d, index) {
                    var card = document.createElement("article");
                    card.className = "card";
                    card.dataset.search = (
                        d.name +
                        " " +
                        d.keywords +
                        " " +
                        d.desc
                    ).toLowerCase();

                    var h = document.createElement("h2");
                    h.id = "diagram-title-" + index;
                    h.textContent = d.name;
                    card.appendChild(h);

                    var kw = document.createElement("p");
                    kw.className = "kw";
                    kw.textContent = "Schlüsselwort: " + d.code.split(/\s+/)[0];
                    card.appendChild(kw);

                    var desc = document.createElement("p");
                    desc.className = "desc";
                    desc.textContent = d.desc;
                    card.appendChild(desc);

                    var render = document.createElement("div");
                    render.className = "render";
                    render.setAttribute("aria-labelledby", h.id);
                    var loading = document.createElement("p");
                    loading.className = "loading";
                    loading.textContent = "Diagramm wird gerendert ...";
                    render.appendChild(loading);
                    card.appendChild(render);

                    var details = document.createElement("details");
                    var summary = document.createElement("summary");
                    summary.textContent = "Mermaid-Code anzeigen";
                    details.appendChild(summary);

                    var head = document.createElement("div");
                    head.className = "code-head";
                    var copy = document.createElement("button");
                    copy.type = "button";
                    copy.className = "copy";
                    copy.textContent = "Code kopieren";
                    copy.addEventListener("click", function () {
                        var done = function () {
                            copy.textContent = "Kopiert";
                            setTimeout(function () {
                                copy.textContent = "Code kopieren";
                            }, 1500);
                        };
                        if (
                            navigator.clipboard &&
                            navigator.clipboard.writeText
                        ) {
                            navigator.clipboard
                                .writeText(d.code)
                                .then(done, function () {
                                    copy.textContent = "Kopieren nicht möglich";
                                });
                        } else {
                            copy.textContent = "Kopieren nicht möglich";
                        }
                    });
                    head.appendChild(copy);
                    details.appendChild(head);

                    var pre = document.createElement("pre");
                    var code = document.createElement("code");
                    code.textContent = d.code;
                    pre.appendChild(code);
                    details.appendChild(pre);
                    card.appendChild(details);

                    grid.appendChild(card);
                    return { card: card, render: render, data: d };
                }

                diagrams.forEach(function (d, i) {
                    cards.push(buildCard(d, i));
                });

                function updateFilter() {
                    var q = filter.value.trim().toLowerCase();
                    var shown = 0;
                    cards.forEach(function (c) {
                        var match =
                            q === "" || c.card.dataset.search.indexOf(q) !== -1;
                        c.card.hidden = !match;
                        if (match) {
                            shown++;
                        }
                    });
                    count.textContent =
                        shown + " von " + cards.length + " Diagrammarten";
                }

                filter.addEventListener("input", updateFilter);
                updateFilter();

                if (!window.mermaid) {
                    cards.forEach(function (c) {
                        c.render.innerHTML =
                            '<p class="error">Mermaid konnte nicht geladen werden. Der Code bleibt sichtbar.</p>';
                    });
                    return;
                }

                mermaid.initialize({
                    startOnLoad: false,
                    securityLevel: "strict",
                    theme: "neutral",
                });

                // Nacheinander rendern, damit sich die Renderer nicht gegenseitig stören
                cards.reduce(function (prev, c, i) {
                    return prev.then(function () {
                        return mermaid
                            .render("mmd-" + i, c.data.code)
                            .then(function (result) {
                                c.render.innerHTML = result.svg;
                            })
                            .catch(function (err) {
                                c.render.innerHTML = "";
                                var p = document.createElement("p");
                                p.className = "error";
                                p.textContent =
                                    "Fehler beim Rendern: " +
                                    (err && err.message
                                        ? err.message.split("\n")[0]
                                        : err);
                                c.render.appendChild(p);
                            });
                    });
                }, Promise.resolve());
            })();
        </script>
    </body>
</html>
