                    <label for="">Email</label>

                    <button>Jetzt einloggen</button>

            </form>

            <script>
                // Ereignisse
                document.addEventListener("DOMContentLoaded", (event) => {
                    console.clear()
                    // - - - - - - - - - -
                    // ES Modulen?

                    // ES Classes?

                    // Setup, Konfiguration

                })
            </script>

        <script>
            // klassische Funktionssyntax
            function doSth1() {}

            // Arrow Function
            const doSth2 = () => {}
            const doSth3 = (param) => result // (param) => {return result}

            // Wenn ALLES geladen ist: DOM, Bilder, externe Files ...
            window.addEventListener("load", () => {
                console.log("Window is ready!")
            })

            // Wenn das HTML im Arbeitsspeicher steht
            document.addEventListener("DOMContentLoaded", (event) => {
                // - - - - - - - - - -
                const obj = window.document.querySelector("h1")

                obj.style.fontFamily = "sans-serif"

                console.log(obj)
                console.dir(obj)

                const arr = document.querySelectorAll(".red") // Array
                console.log(arr)

                // Klassenselektor
                document.getElementsByClassName("red")
                // ID-Selektor
                document.getElementById("myId")

                // - - - - - - - - - -
            })

            // DOM verändern, aufbauen und löschen
            document.addEventListener("DOMContentLoaded", (event) => {
                console.clear()
                // - - - - - - - - - -
                const myDiv = document.getElementById("gen123xyz")

                // HTML Attribute (allgemein) hinzufügen
                myDiv.setAttribute("title", "neuer Wert")
                myDiv.setAttribute("title", "neuer Wert, überarbeitet")
                // myDiv.removeAttribute("title")

                myDiv.title = "1234567"
                myDiv.myAttribute = "123"
                myDiv.myAttribute = "456"
                console.log(myDiv.title)
                console.dir(myDiv)

                // Klassen und Data manipulieren
                myDiv.classList.add("green")
                myDiv.classList.add("bold")
                myDiv.classList.remove("green")
                myDiv.classList.toggle("active")
                // myDiv.classList.toggle("active")

                myDiv.dataset.myAttribute = 123
                myDiv.dataset.id = 123
                myDiv.dataset.target = 123
                myDiv.dataset.state = 123

                // Elemente herstellen
                const newElement = document.createElement("span")
                newElement.id = "myId-2"

                newElement.textContent = "eine <i>Textergänzung</i>"
                newElement.innerText = "<i>was altes</i>"
                newElement.innerHTML = "<u>neues</u> <i>Textergänzung</i>"

                // Anführungzeichen
                // "<p class=\"green\">Grün</p>"
                // '<p class="green">Grün</p>'

                // String Literal
                const h1 = document.querySelector("h1")
                let value = `
                <u>
                    ${h1.textContent} neue Textergänzung
                    <i>eine Zeile 2</i>
                    dritte Zeile
                </u>
                `
                myDiv.innerHTML = value

                document.querySelector("h1").appendChild(newElement)
                // ... .parentNode.insertBefore und weitere -> Forschungauftrag!
                // - - - - - - - - - -
            })
        </script>
