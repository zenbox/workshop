<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Three Pages</title>
        <link
            rel="stylesheet"
            href="assets/css/styles.css" />
    </head>
    <body>
        <!-- - - - -->
        <ul
            class="nav nav-tabs"
            id="myTab"
            role="tablist">
            <li
                class="nav-item"
                role="presentation">
                <button
                    class="nav-link active"
                    id="home-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#home-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="home-tab-pane"
                    aria-selected="true">
                    Home
                </button>
            </li>
            <li
                class="nav-item"
                role="presentation">
                <button
                    class="nav-link"
                    id="profile-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#profile-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="profile-tab-pane"
                    aria-selected="false">
                    Profile
                </button>
            </li>
            <li
                class="nav-item"
                role="presentation">
                <button
                    class="nav-link"
                    id="contact-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#contact-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="contact-tab-pane"
                    aria-selected="false">
                    Contact
                </button>
            </li>
        </ul>
        <div
            class="tab-content"
            id="myTabContent">
            <div
                class="tab-pane fade show active"
                id="home-tab-pane"
                role="tabpanel"
                aria-labelledby="home-tab"
                tabindex="0">
                <div class="custom-page" id="custom-page-1">One</div>
            </div>
            <div
                class="tab-pane fade"
                id="profile-tab-pane"
                role="tabpanel"
                aria-labelledby="profile-tab"
                tabindex="0">
                <div class="custom-page" id="custom-page-2">Two</div>
            </div>
            <div
                class="tab-pane fade"
                id="contact-tab-pane"
                role="tabpanel"
                aria-labelledby="contact-tab"
                tabindex="0">
                <div class="custom-page" id="custom-page-3">Three</div>
            </div>
        </div>
        <!-- - - - -->
        <script src="assets/vendor/bootstrap/bootstrap.bundle.js"></script>
    </body>
</html>
