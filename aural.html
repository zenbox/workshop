<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/assets/css/styles.css" />
        <title>Sprachausgabe im Vergleich</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                line-height: 1.5;
                max-width: 52rem;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            .hinweis {
                font-size: 0.9rem;
                color: #555;
            }
            .karte {
                border: 1px solid #ccc;
                border-radius: 0.5rem;
                padding: 1rem;
                margin-bottom: 1rem;
            }
            .karte h2 {
                font-size: 1.05rem;
                margin: 0 0 0.5rem;
            }
            pre {
                background: #f4f4f4;
                padding: 0.5rem;
                border-radius: 0.375rem;
                font-size: 0.85rem;
                overflow: auto;
            }
            button,
            select {
                font: inherit;
                padding: 0.4rem 0.9rem;
                border-radius: 0.375rem;
                border: 1px solid #333;
                background: #fff;
                cursor: pointer;
            }
            button:disabled,
            select:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            button:focus-visible,
            select:focus-visible {
                outline: 3px solid #0a58ca;
                outline-offset: 2px;
            }
            .leiste {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                align-items: center;
                margin-bottom: 1rem;
            }
        </style>
    </head>
    <body>
        <!-- >>>>>>> -->
        <h1>Sprachausgabe im Vergleich</h1>
        <p class="hinweis">
            Die CSS-Eigenschaften zur Sprachausgabe (speech-rate, pitch, volume, voice-family) werden von Browsern nicht umgesetzt.
            Unten stehen die CSS-Werte zur Dokumentation. Abgespielt wird über die Web Speech API mit den passenden Einstellungen.
        </p>

        <div class="leiste">
            <label for="stimme">Stimme:</label>
            <select id="stimme"></select>
            <button type="button" id="stopp">Stopp</button>
            <span id="status" role="status" class="hinweis"></span>
        </div>

        <div id="karten"></div>

        <script>
            const TEXT = 'Willkommen bei der GFU. Ihr Seminar beginnt am Montag um neun Uhr.';

            // CSS-Werte zur Dokumentation, opts = Entsprechung in der Web Speech API
            const BEISPIELE = [
                {
                    titel: 'Standard',
                    css: 'speech-rate: medium;\npitch: medium;\nvolume: 100;',
                    opts: { rate: 1, pitch: 1, volume: 1 },
                },
                {
                    titel: 'Langsam',
                    css: 'speech-rate: slow;',
                    opts: { rate: 0.75, pitch: 1, volume: 1 },
                },
                {
                    titel: 'Schnell',
                    css: 'speech-rate: fast;',
                    opts: { rate: 1.3, pitch: 1, volume: 1 },
                },
                {
                    titel: 'Hohe Stimme',
                    css: 'pitch: high;',
                    opts: { rate: 1, pitch: 1.5, volume: 1 },
                },
                {
                    titel: 'Tiefe Stimme',
                    css: 'pitch: low;',
                    opts: { rate: 1, pitch: 0.6, volume: 1 },
                },
                {
                    titel: 'Leise',
                    css: 'volume: 40;',
                    opts: { rate: 1, pitch: 1, volume: 0.4 },
                },
                {
                    titel: 'Kombination: langsam, tief, leise',
                    css: 'speech-rate: slow;\npitch: low;\nvolume: 60;',
                    opts: { rate: 0.75, pitch: 0.7, volume: 0.6 },
                },
            ];

            const stimmeAuswahl = document.getElementById('stimme');
            const stoppBtn = document.getElementById('stopp');
            const statusEl = document.getElementById('status');
            const karten = document.getElementById('karten');
            const unterstuetzt = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

            function fuelleStimmen() {
                const alle = speechSynthesis.getVoices();
                const deutsch = alle.filter((v) => v.lang.startsWith('de'));
                const liste = deutsch.length ? deutsch : alle;
                stimmeAuswahl.replaceChildren(...liste.map((v) => new Option(`${v.name} (${v.lang})`, v.name)));
                if (!liste.length) {
                    stimmeAuswahl.replaceChildren(new Option('Keine Stimme verfügbar', ''));
                }
            }

            function sprich(beispiel) {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(TEXT);
                u.lang = 'de-DE';
                const stimme = speechSynthesis.getVoices().find((v) => v.name === stimmeAuswahl.value);
                if (stimme) u.voice = stimme;
                Object.assign(u, beispiel.opts);
                u.onstart = () => (statusEl.textContent = `Spielt: ${beispiel.titel}`);
                u.onend = () => (statusEl.textContent = '');
                u.onerror = () => (statusEl.textContent = 'Die Wiedergabe ist fehlgeschlagen.');
                speechSynthesis.speak(u);
            }

            function baueKarten() {
                BEISPIELE.forEach((beispiel) => {
                    const karte = document.createElement('section');
                    karte.className = 'karte';

                    const h2 = document.createElement('h2');
                    h2.textContent = beispiel.titel;

                    const pre = document.createElement('pre');
                    pre.textContent = beispiel.css;

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = 'Abspielen';
                    btn.disabled = !unterstuetzt;
                    btn.addEventListener('click', () => sprich(beispiel));

                    karte.append(h2, pre, btn);
                    karten.appendChild(karte);
                });
            }

            if (!unterstuetzt) {
                statusEl.textContent = 'Dieser Browser unterstützt keine Sprachausgabe.';
                stimmeAuswahl.disabled = true;
                stoppBtn.disabled = true;
            } else {
                fuelleStimmen();
                speechSynthesis.onvoiceschanged = fuelleStimmen;
                stoppBtn.addEventListener('click', () => {
                    speechSynthesis.cancel();
                    statusEl.textContent = '';
                });
            }
            baueKarten();
        </script>
        <!-- <<<<<<< -->
    </body>
</html>
