<!doctype html>
<html
    lang="en"
    class="custom-dev my-font">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Custom Grid</title>
        <link
            rel="stylesheet"
            href="assets/css/styles.css" />
    </head>

    <body>
        <div class="container-fluid">
            <!-- - - - -->

            <div class="custom-grid">
                <!-- - - - - - - - - - --->
                <div class="custom-grid__element">
                    <!-- - - - -->
                    <div
                        id="jump-to"
                        class="custom-grid__element__input-group">
                        <label
                            for="custom-form-control-input1"
                            class="form-label"
                            ><b>4a.</b> surveyed
                            <strong>ground</strong> operations</label
                        >
                        <p>date (dd/mm/yy)</p>
                        <input
                            type="date"
                            lang="en-US"
                            class="form-control form-control-sm text-center"
                            id="custom-form-control-input1"
                            placeholder="name@example.com" />
                    </div>
                    <!-- - - - -->
                </div>
                <div class="container custom-grid__component">
                    <!-- - - - - - - - - - - -->

                    <form
                        class="row g-3 needs-validation"
                        novalidate>
                        <div class="col-md-4">
                            <label
                                for="validationCustom01"
                                class="form-label"
                                >First name</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="validationCustom01"
                                value="Mark"
                                required />
                            <div class="valid-feedback">Looks good!</div>
                        </div>
                        <div class="col-md-4">
                            <label
                                for="validationCustom02"
                                class="form-label"
                                >Last name</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="validationCustom02"
                                value="Otto"
                                required />
                            <div class="valid-feedback">Looks good!</div>
                        </div>
                        <div class="col-md-4">
                            <label
                                for="validationCustomUsername"
                                class="form-label"
                                >Username</label
                            >
                            <div class="input-group has-validation">
                                <span
                                    class="input-group-text"
                                    id="inputGroupPrepend"
                                    >@</span
                                >
                                <input
                                    type="text"
                                    class="form-control"
                                    id="validationCustomUsername"
                                    aria-describedby="inputGroupPrepend"
                                    required />
                                <div class="invalid-feedback">
                                    Please choose a username.
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label
                                for="validationCustom03"
                                class="form-label"
                                >City</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="validationCustom03"
                                required />
                            <div class="invalid-feedback">
                                Please provide a valid city.
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label
                                for="validationCustom04"
                                class="form-label"
                                >State</label
                            >
                            <select
                                class="form-select"
                                id="validationCustom04"
                                required>
                                <option
                                    selected
                                    disabled
                                    value="">
                                    Choose...
                                </option>
                                <option>...</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select a valid state.
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label
                                for="validationCustom05"
                                class="form-label"
                                >Zip</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="validationCustom05"
                                required />
                            <div class="invalid-feedback">
                                Please provide a valid zip.
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    value=""
                                    id="invalidCheck"
                                    required />
                                <label
                                    class="form-check-label"
                                    for="invalidCheck">
                                    Agree to terms and conditions
                                </label>
                                <div class="invalid-feedback">
                                    You must agree before submitting.
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <button
                                class="btn btn-primary"
                                type="submit">
                                Submit form
                            </button>
                        </div>
                    </form>

                    <script>
                        // Example starter JavaScript for disabling form submissions if there are invalid fields
                        (() => {
                            "use strict";

                            // Fetch all the forms we want to apply custom Bootstrap validation styles to
                            const forms =
                                document.querySelectorAll(".needs-validation");

                            // Loop over them and prevent submission
                            Array.from(forms).forEach((form) => {
                                form.addEventListener(
                                    "submit",
                                    (event) => {
                                        if (!form.checkValidity()) {
                                            event.preventDefault();
                                            event.stopPropagation();
                                        }

                                        form.classList.add("was-validated");
                                    },
                                    false
                                );
                            });
                        })();
                    </script>
                    <!-- - - - - - - - - - - -->
                </div>
                <div class="custom-grid__component container">
                    <div class="row">
                    <!-- - - - - - - - - - - -->
                    <h2>Auto-Ergänzung nach Eingabe</h2>

                    <label for="text">Text</label>
                    <span class=" col-25 bs bs-skull auto-addition" style="border: 1px dotted grey; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; column-gap: 1rem;">
                        <input
                            id="text"
                            type="text"
                            name="text"
                            value=""
                            required
                            pattern="(fl|ft|m) \d+(\.\d+)?"
                    /></span>
                    <p class="auto-currency">42</p>
                    <style>
                        .auto-addition:has(input:invalid)::after {
                            content: " gnd";

                            display: inline-block;
                            height: 29px;
                            border: 1px solid lightgrey;
                            border-top-right-radius: 4px;
                            border-bottom-right-radius: 4px;

                        }
                        .auto-currency::after {
                            content: " €";
                        }
                    </style>

                    <!-- - - - - - - - - - - -->
                     </div>
                </div>
                <!-- - - - - - - - - - --->
            </div>

            <!-- - - - -->
        </div>
        <script src="assets/vendor/bootstrap/bootstrap.bundle.js"></script>
    </body>
</html>
